# TIJDELIJK: roept de diagnoseroute aan en zet de uitkomst in het log. Wordt na de SIS-fix verwijderd.
name: Diagnose Georisques (tijdelijk)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnoseroute aanroepen
        run: |
          curl -sS --max-time 60 -D - "https://vastgoed-analyse-v84x.vercel.app/api/diag-georisques?cb=$(date +%s)" -o diag.json | grep -i -E "^(HTTP|x-vercel-id)"
          echo "=== BEGIN DIAG ==="
          cat diag.json
          echo
          echo "=== EINDE DIAG ==="
